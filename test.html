<style>
*, *::before, *::after { box-sizing: border-box; }
html, body, h1, h2, h3, h4, h5, h6, p, ul, ol, li, menu, figure, blockquote { margin: 0; padding: 0; }
ul, ol, menu { list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
svg { display: block; }
:root {
  --font-hero:    "Bodoni Moda", Georgia, "Times New Roman", serif;
  --font-ui: "Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #0A0A0A;
  --text: #f5f5f6;
  --text-dim: #dddddd;
  --text-soft: #9a9aa2;
  --text-muted: #6a6a72;
  --hover-color:  #A8895C;
  --hover-shadow: rgba(168, 137, 92, 0.55);
  --hover-glow:   rgba(168, 137, 92, 0.22);
  --glass-bg: rgba(255, 255, 255, 0.05);
  --glass-border: rgba(255, 255, 255, 0.08);
  --glass-blur: 26px;
  --glass-sat: 1.4;
  --glass-radius: 24px;
  --grid-max-w: min(1360px, 88vw);
  --grid-max-h: min(780px, 82vh);
  --gap: 16px;
  --cols: 4;
  --ref-w: 1920;
  --hero-top: 10.3vh;
  --hero-gap: 4.1vh;
  --hero-text-gap: 8px;
  --hero-stack-gap: 28px;
  --photo-h: 104vh;
  --photo-h-max: 175vw;
  --name-size: 21.3vw;
  --name-x: 0vw;
  --name-y: 0vh;
  --name-opsz: 96;
  --name-stroke: 0px;
  --author-size-v: 22;
  --author-x: -31vw;
  --author-y: 0vh;
  --desc-x: -31vw;
  --desc-y: 0.5vh;
  --btn-x: -31.2vw;
  --btn-y: -0.3vh;
  --desc-size-v: 16;
  --desc-width-v: 478;
  --btn-size-v: 13;
  --btn-gap-v: 15;
  --btn-pad-y: 1em;
  --btn-pad-x: 2.2em;
  --btn-scale: 1;
  --actions-max-w: 2000px;
  --author-size: max(14px, calc(var(--author-size-v) * 100vw / var(--ref-w)));
  --desc-size:   max(13px, calc(var(--desc-size-v)   * 100vw / var(--ref-w)));
  --desc-width:  max(240px, calc(var(--desc-width-v) * 100vw / var(--ref-w)));
  --btn-size-base: max(12px, calc(var(--btn-size-v)  * 100vw / var(--ref-w)));
  --btn-size: calc(var(--btn-size-base) * var(--btn-scale));
  --btn-gap:   max(8px,  calc(var(--btn-gap-v)   * 100vw / var(--ref-w)));
  --ease-out-smooth: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-soft:    cubic-bezier(0.4, 0, 0.6, 1);
  --ease: cubic-bezier(.22, .61, .36, 1);
  --view-fade: 500ms;
  --dur-name:  1100ms;
  --dur-photo: 1150ms;
  --dur-desc:  950ms;
  --dur-btn:   950ms;
  --dur-tile:  850ms;
  --step-ms:   80;
  --delay-name:  60ms;
  --delay-photo: 200ms;
  --delay-desc:  400ms;
  --delay-btn:   540ms;
  --safe-top: 0px;
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --vv-bottom: 0px;
  --vv-top: 0px;
  --bottom-safe: max(var(--safe-bottom), var(--vv-bottom));
  --vvh: 100dvh;
  --vvw: 100vw;
  --vis-top: 0px;
  --vis-bottom: 0px;
  --vis-h: 100dvh;
  --vis-w: 100vw;
  --photo-ratio: 1.5;
  --photo-h-scale: 104;
  --photo-h-max-scale: 150;
  --photo-frame-h: min(
    calc(var(--vis-h) * var(--photo-h-scale) / 100),
    calc(var(--vis-w) * var(--photo-h-max-scale) / 100)
  );
  --photo-frame-w: calc(var(--photo-frame-h) * var(--photo-ratio));
  --kravvi-x-v: 50;
  --kravvi-y-v: 21;
  --kravvi-size: 17.5;
  --kravvi-shift-x: 0cqw;
  --kravvi-shift-y: 0cqw;
  --kravvi-font-px: calc(var(--photo-frame-w) * var(--kravvi-size) / 100);
  --stack-shift-x-v: 0;
  --stack-shift-y-v: 0;
  --stack-collision-gap: 16px;
  --stack-width: 640px;
  --ma-x: 0;
  --ma-y: 5;
  --md-x: 0;
  --md-y: 5.5;
  --mb-x: 0;
  --mb-y: 3;
}
html, body {
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.45;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
}
body.is-loading { visibility: visible; }
body.is-loading > * { visibility: hidden; }
.brand-tag {
  position: fixed;
  top: calc(22px + var(--safe-top));
  left: calc(24px + var(--safe-left));
  z-index: 0;
  font-family: var(--font-ui);
  font-weight: 400;
  font-size: 10.5px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  transition: opacity 350ms var(--ease-out-smooth), transform 350ms var(--ease-out-smooth);
}
.lang-btn {
  position: fixed;
  top: calc(18px + var(--safe-top));
  right: calc(24px + var(--safe-right));
  z-index: 101;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-radius: 999px;
  transition:
    background 220ms var(--ease),
    color 220ms var(--ease),
    opacity 350ms var(--ease-out-smooth),
    transform 350ms var(--ease-out-smooth);
  user-select: none;
  -webkit-user-select: none;
}
.lang-btn:hover { color: #fff; background: rgba(255,255,255,0.06); }
.lang-menu {
  position: fixed;
  top: calc(48px + var(--safe-top));
  right: calc(24px + var(--safe-right));
  z-index: 102;
  min-width: 84px;
  padding: 5px;
  background: rgba(255, 255, 255, 0.06);
  backdrop-filter: blur(18px) saturate(1.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-radius: 14px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.45);
  display: flex;
  flex-direction: column;
  gap: 2px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition:
    opacity 220ms var(--ease-out-smooth),
    visibility 0ms linear 220ms,
    transform 220ms var(--ease-out-smooth);
}
.lang-menu.is-open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
  transition:
    opacity 220ms var(--ease-out-smooth),
    visibility 0ms linear 0ms,
    transform 220ms var(--ease-out-smooth);
}
.lang-item {
  display: block;
  width: 100%;
  text-align: center;
  padding: 6px 14px;
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  border-radius: 9px;
  transition: background 180ms var(--ease), color 180ms var(--ease);
  cursor: pointer;
}
.lang-item:hover { background: rgba(255,255,255,0.10); color: #fff; }
.lang-item.is-active { color: #fff; background: rgba(255,255,255,0.06); }
.copyright {
  position: fixed;
  bottom: calc(20px + var(--bottom-safe));
  right: calc(24px + var(--safe-right));
  z-index: 100;
  font-family: var(--font-ui);
  font-weight: 400;
  font-size: 10.5px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
  user-select: none;
  -webkit-user-select: none;
  pointer-events: none;
  transition: opacity 350ms var(--ease-out-smooth), transform 350ms var(--ease-out-smooth);
}
body.overlay-active .brand-tag,
body.overlay-active .lang-btn,
body.overlay-active .lang-menu,
body.overlay-active .copyright {
  opacity: 0;
  pointer-events: none;
}
body.overlay-active .brand-tag { transform: translateY(-8px); }
body.overlay-active .copyright  { transform: translateY(8px); }
#app {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  z-index: 1;
}
.view-home {
  position: absolute;
  inset: 0;
  z-index: 1;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition:
    opacity var(--view-fade) var(--ease-out-smooth),
    visibility 0ms linear var(--view-fade);
}
.view-home.is-active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition:
    opacity var(--view-fade) var(--ease-out-smooth),
    visibility 0ms linear 0ms;
}
.home-stage {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
}
.hero-artboard {
  display: contents;
}
.hero-name {
  position: absolute;
  top: var(--hero-top);
  left: 50%;
  margin: 0;
  font-family: var(--font-hero);
  font-weight: 600;
  font-optical-sizing: none;
  font-variation-settings: "opsz" var(--name-opsz, 96), "wght" 600;
  font-size: var(--name-size);
  line-height: 0.92;
  letter-spacing: 0.02em;
  color: #ffffff;
  white-space: nowrap;
  font-feature-settings: "locl" 0;
  -webkit-text-stroke: var(--name-stroke) currentColor;
  text-stroke: var(--name-stroke) currentColor;
  paint-order: stroke fill;
  z-index: 1;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  opacity: 0;
  filter: blur(14px);
  transform: translateX(-50%) translate(var(--name-x), calc(var(--name-y) + 20px));
  transition:
    opacity 400ms var(--ease-in-soft),
    filter 400ms var(--ease-in-soft),
    transform 400ms var(--ease-in-soft);
}
#view-home.is-active .hero-name {
  opacity: 1;
  filter: blur(0);
  transform: translateX(-50%) translate(var(--name-x), var(--name-y));
  transition:
    opacity var(--dur-name) var(--ease-out-smooth) var(--delay-name),
    filter var(--dur-name) var(--ease-out-smooth) var(--delay-name),
    transform var(--dur-name) var(--ease-out-smooth) var(--delay-name);
}
.hero-photo-wrap {
  position: absolute;
  inset: 0;
  z-index: 2;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  pointer-events: none;
}
.hero-photo-wrap picture { display: contents; }
.hero-photo {
  position: relative;
  height: min(var(--photo-h), var(--photo-h-max));
  width: auto;
  max-width: none;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
  opacity: 0;
  filter: blur(12px);
  transform: translateY(28px);
  transition:
    opacity 400ms var(--ease-in-soft),
    filter 400ms var(--ease-in-soft),
    transform 400ms var(--ease-in-soft);
}
#view-home.is-active .hero-photo {
  opacity: 1;
  filter: none;
  transform: none;
  transition:
    opacity var(--dur-photo) var(--ease-out-smooth) var(--delay-photo),
    filter var(--dur-photo) var(--ease-out-smooth) var(--delay-photo),
    transform var(--dur-photo) var(--ease-out-smooth) var(--delay-photo);
}
.hero-stack {
  position: absolute;
  top: calc(var(--hero-top) + (var(--name-size) * 0.9) + var(--hero-gap));
  left: 50%;
  transform: translateX(-50%);
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--hero-stack-gap);
  width: max-content;
  max-width: calc(100vw - 40px);
  pointer-events: none;
}
.hero-stack > * { pointer-events: auto; }
.hero-text {
  display: flex;
  flex-direction: column;
  gap: var(--hero-text-gap);
  align-items: flex-start;
}
.hero-author {
  font-family: var(--font-ui);
  font-weight: 400;
  font-size: var(--author-size);
  letter-spacing: 0.01em;
  color: var(--text);
  line-height: 1.3;
  opacity: 0;
  filter: blur(10px);
  transform: translate(var(--author-x), calc(var(--author-y) + 14px));
  transition:
    opacity 400ms var(--ease-in-soft),
    filter 400ms var(--ease-in-soft),
    transform 400ms var(--ease-in-soft);
}
#view-home.is-active .hero-author {
  opacity: 1;
  filter: blur(0);
  transform: translate(var(--author-x), var(--author-y));
  transition:
    opacity var(--dur-desc) var(--ease-out-smooth) var(--delay-desc),
    filter var(--dur-desc) var(--ease-out-smooth) var(--delay-desc),
    transform var(--dur-desc) var(--ease-out-smooth) var(--delay-desc);
}
.hero-tagline {
  font-family: var(--font-ui);
  font-weight: 300;
  font-size: var(--desc-size);
  line-height: 1.55;
  letter-spacing: 0.005em;
  color: var(--text-dim);
  text-align: left;
  hyphens: none;
  width: var(--desc-width);
  max-width: 90vw;
  opacity: 0;
  filter: blur(10px);
  transform: translate(var(--desc-x), calc(var(--desc-y) + 18px));
  transition:
    opacity 400ms var(--ease-in-soft),
    filter 400ms var(--ease-in-soft),
    transform 400ms var(--ease-in-soft);
}
#view-home.is-active .hero-tagline {
  opacity: 1;
  filter: blur(0);
  transform: translate(var(--desc-x), var(--desc-y));
  transition:
    opacity var(--dur-desc) var(--ease-out-smooth) var(--delay-desc),
    filter var(--dur-desc) var(--ease-out-smooth) var(--delay-desc),
    transform var(--dur-desc) var(--ease-out-smooth) var(--delay-desc);
}
body.overlay-active #view-home.is-active .hero-author,
body.overlay-active #view-home.is-active .hero-tagline {
  opacity: 0;
  filter: blur(12px);
  pointer-events: none;
  transition:
    opacity 500ms var(--ease-in-soft),
    filter 500ms var(--ease-in-soft),
    transform 500ms var(--ease-in-soft);
}
body.overlay-active #view-home.is-active .hero-author {
  transform: translate(var(--author-x), calc(var(--author-y) + 20px));
}
body.overlay-active #view-home.is-active .hero-tagline {
  transform: translate(var(--desc-x), calc(var(--desc-y) + 20px));
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--btn-gap);
  max-width: var(--actions-max-w);
  opacity: 0;
  transform: translate(var(--btn-x), calc(var(--btn-y) + 18px));
  transition:
    opacity 400ms var(--ease-in-soft),
    transform 400ms var(--ease-in-soft);
}
#view-home.is-active .hero-actions {
  opacity: 1;
  transform: translate(var(--btn-x), var(--btn-y));
  transition:
    opacity var(--dur-btn) var(--ease-out-smooth) var(--delay-btn),
    transform var(--dur-btn) var(--ease-out-smooth) var(--delay-btn);
}
body.overlay-active #view-home.is-active .hero-actions {
  opacity: 0;
  transform: translate(var(--btn-x), calc(var(--btn-y) + 24px));
  pointer-events: none;
  transition:
    opacity 500ms var(--ease-in-soft),
    transform 500ms var(--ease-in-soft);
}
.hero-actions .btn-pill {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--btn-pad-y) var(--btn-pad-x);
  font-family: var(--font-ui);
  font-weight: 500;
  font-size: var(--btn-size);
  letter-spacing: 0.01em;
  color: var(--text);
  background: rgba(255, 255, 255, 0.045);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border: 1px solid var(--glass-border);
  border-radius: 999px;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  outline: none;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
  transform: translateZ(0);
  backface-visibility: hidden;
  transition:
    color 400ms ease,
    transform 400ms ease,
    text-shadow 400ms ease,
    border-color 400ms ease;
}
.hero-actions .btn-pill::before {
  content: "";
  position: absolute;
  inset: -1px;
  z-index: -1;
  border-radius: inherit;
  background: var(--hover-color);
  box-shadow:
    0 0 8px   var(--hover-shadow),
    0 0 28px  var(--hover-shadow),
    0 0 80px  rgba(168, 137, 92, 0.32),
    0 0 140px rgba(168, 137, 92, 0.18),
    -50px 0 110px -20px var(--hover-glow),
     50px 0 110px -20px var(--hover-glow),
    0 -40px 90px -20px var(--hover-glow),
    0  40px 90px -20px var(--hover-glow);
  opacity: 0;
  transition: opacity 400ms ease;
  pointer-events: none;
}
@media (hover: hover) and (pointer: fine) {
  .hero-actions .btn-pill:hover::before { opacity: 1; }
  .hero-actions .btn-pill:hover {
    color: #ffffff;
    border-color: transparent;
    text-shadow:
      0 0 5px  rgba(255, 255, 255, 0.85),
      0 0 10px rgba(255, 255, 255, 0.55),
      0 0 20px rgba(255, 255, 255, 0.25);
    transform: translateY(-2px) translateZ(0);
  }
  .hero-actions .btn-pill:active {
    transform: translateY(0) scale(0.985) translateZ(0);
  }
}
.hero-actions .btn-pill.is-tapped::before {
  opacity: 1;
  transition: opacity 150ms ease;
}
.hero-actions .btn-pill.is-tapped {
  color: #ffffff;
  border-color: transparent;
  text-shadow:
    0 0 5px  rgba(255, 255, 255, 0.85),
    0 0 10px rgba(255, 255, 255, 0.55),
    0 0 20px rgba(255, 255, 255, 0.25);
  transform: translateY(-2px) translateZ(0);
  transition:
    color 150ms ease,
    text-shadow 150ms ease,
    transform 150ms ease,
    border-color 150ms ease;
}
.hero-actions .btn-pill:focus-visible::before { opacity: 1; }
.hero-actions .btn-pill:focus-visible {
  color: #ffffff;
  border-color: transparent;
  text-shadow:
    0 0 5px  rgba(255, 255, 255, 0.85),
    0 0 10px rgba(255, 255, 255, 0.55),
    0 0 20px rgba(255, 255, 255, 0.25);
  transform: translateY(-2px) translateZ(0);
}
.view-grid {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--gap);
  padding:
    calc(60px + var(--safe-top))
    calc(60px + var(--safe-right))
    calc(60px + var(--bottom-safe))
    calc(60px + var(--safe-left));
  overflow: hidden;
  isolation: isolate;
  opacity: 0;
  visibility: hidden;

        unitEl.textContent = p.unit || '—';
        var plus = document.createElement('button');
        plus.type = 'button';
        plus.textContent = '+';
        plus.setAttribute('data-dir', '1');
        plus.setAttribute('data-key', p.key);
        ctrls.appendChild(minus);
        ctrls.appendChild(input);
        ctrls.appendChild(unitEl);
        ctrls.appendChild(plus);
        row.appendChild(label);
        row.appendChild(ctrls);
        propsEl.appendChild(row);
      });
      groupEl.appendChild(propsEl);
      box.appendChild(groupEl);
    });
  }
  function renderAll() {
    renderContexts();
    renderStep();
    renderGroups();
  }
  fab.addEventListener('click', function () { panel.classList.toggle('is-open'); });
  panel.querySelector('.tuner-close').addEventListener('click', function () {
    panel.classList.remove('is-open');
  });
  panel.querySelector('[data-role="contexts"]').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-ctx]');
    if (!b) return;
    currentContext = b.getAttribute('data-ctx');
    applyContextValues();
    captureMeta(currentContext);
    renderAll();
  });
  panel.querySelector('[data-role="step"]').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-step]');
    if (!b) return;
    currentStep = parseFloat(b.getAttribute('data-step'));
    renderStep();
  });
  panel.querySelector('[data-role="groups"]').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-dir]');
    if (!b) return;
    var key = b.getAttribute('data-key');
    var dir = parseFloat(b.getAttribute('data-dir'));
    var cur = parseFloat(getValues(currentContext)[key]);
    if (!isFinite(cur)) cur = 0;
    setValue(currentContext, key, fmt(cur + dir * currentStep));
    applyContextValues();
    renderGroups();
  });
  panel.querySelector('[data-role="groups"]').addEventListener('input', function (e) {
    var input = e.target.closest('input[data-key]');
    if (!input) return;
    var key = input.getAttribute('data-key');
    var v = parseFloat(input.value);
    if (!isFinite(v)) return;
    setValue(currentContext, key, fmt(v));
    applyContextValues();
  });
  panel.querySelector('.tuner-actions').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-action]');
    if (!b) return;
    var action = b.getAttribute('data-action');
    if (action === 'copy-all' || action === 'copy-current') {
      var json = action === 'copy-all' ? exportJSON() : exportCurrentJSON();
      var ta = panel.querySelector('[data-role="json"]');
      ta.value = json;
      try { ta.select(); document.execCommand('copy'); } catch (err) {}
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).catch(function () {});
      }
      var old = b.textContent;
      b.textContent = 'Copied!';
      setTimeout(function () { b.textContent = old; }, 1200);
    }
    if (action === 'reset-ctx') {
      if (!confirm('Сбросить контекст «' + currentContext + '»?')) return;
      delete state.values[currentContext];
      delete state.meta[currentContext];
      saveState();
      applyContextValues();
      renderAll();
    }
    if (action === 'reset-all') {
      if (!confirm('Сбросить ВСЕ значения?')) return;
      state = { values: {}, meta: {} };
      saveState();
      applyContextValues();
      renderAll();
    }
  });
  var rT;
  function onResize() {
    var next = detectContext();
    if (next !== currentContext) {
      currentContext = next;
      applyContextValues();
    }
    captureMeta(currentContext);
    renderAll();
  }
  function addMQListener(mq) {
    if (mq.addEventListener) {
      mq.addEventListener('change', onResize);
    } else if (mq.addListener) {
      mq.addListener(onResize);
    }
  }
  addMQListener(PHONE_MQ);
  addMQListener(ALBUM_MQ);
  addMQListener(TABLET_MQ);
  addMQListener(FINE_POINTER_MQ);
  window.addEventListener('resize', function () {
    clearTimeout(rT);
    rT = setTimeout(onResize, 80);
  });
  window.addEventListener('orientationchange', function () {
    clearTimeout(rT);
    rT = setTimeout(onResize, 150);
  });
  applyContextValues();
  captureMeta(currentContext);
  renderAll();
})();
</script>
<script>
(function initTelegram() {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  var isMiniApp = false;
  if (tg.initData && tg.initData.length > 0) {
    isMiniApp = true;
  } else if (location.hash.indexOf('tgWebAppVersion') !== -1) {
    isMiniApp = true;
  }
  if (!isMiniApp) {
    tg.ready();
    return;
  }
  document.body.classList.add('telegram-mini-app');
  tg.ready();
  var platform = String(tg.platform || '').toLowerCase();
  var ua = navigator.userAgent || '';
  var isMobilePlatform = (platform === 'android' || platform === 'ios');
  var isMobileUA = /Android|iPhone|iPad|iPod|Mobile/i.test(ua);
  var isTouch = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  var useMobileMode = isMobilePlatform || (platform === 'unknown' && isMobileUA && isTouch);
  if (useMobileMode) {
    document.body.classList.add('tg-mobile');
    if (tg.expand) tg.expand();
    if (tg.requestFullscreen) tg.requestFullscreen();
  }
  function updateSafeArea() {
    var top = (tg.contentSafeAreaInset && tg.contentSafeAreaInset.top) ||
              (tg.safeAreaInset && tg.safeAreaInset.top) ||
              0;
    document.documentElement.style.setProperty('--tg-content-safe-area-inset-top', top + 'px');
  }
  updateSafeArea();
  if (tg.onEvent) {
    tg.onEvent('viewportChanged', updateSafeArea);
  }
  if (tg.BackButton) {
    tg.BackButton.onClick(function () {
      window.history.back();
    });
    if (window.updateBackButton && window.getCurrentView) {
      window.updateBackButton(window.getCurrentView());
    }
  }
})();
</script>
