<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>viewport debug 3</title>
<style>
  html, body { margin:0; padding:0; background:#111; color:#eee; }
  body { font: 13px monospace; padding: 12px; }
  #red  { position: fixed; top: 0; left:0; right:0; height:6px; background:#ff2d2d; z-index:9999; }
  #blue { position: fixed; top: env(safe-area-inset-top, 0px); left:0; right:0; height:6px; background:#00b0ff; z-index:9998; }
  #marker { position: absolute; top: 40px; left: 12px; background:#00e676; color:#000; padding:2px 6px; font-weight:bold; }
  div.row { padding:2px 0; }
  b { color:#A8895C; }
</style>
</head>
<body>
<div id="red"></div>
<div id="blue"></div>
<div id="marker">TOP-MARKER</div>
<div style="height:60px"></div>
<div id="out">…</div>
<script>
function envVal(name) {
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:'+name+';left:0;width:1px;height:1px;';
  document.body.appendChild(d);
  var v = getComputedStyle(d).top;
  d.remove();
  return v;
}
function update() {
  var vv = window.visualViewport || {};
  document.getElementById('out').innerHTML =
    '<div class="row"><b>innerH</b>: ' + window.innerHeight + '</div>' +
    '<div class="row"><b>vv.height</b>: ' + vv.height + '</div>' +
    '<div class="row"><b>vv.offsetTop</b>: ' + vv.offsetTop + '</div>' +
    '<div class="row"><b>env top</b>: '    + envVal('env(safe-area-inset-top, 0px)') + '</div>' +
    '<div class="row"><b>env bottom</b>: ' + envVal('env(safe-area-inset-bottom, 0px)') + '</div>' +
    '<div class="row"><b>env left</b>: '   + envVal('env(safe-area-inset-left, 0px)') + '</div>' +
    '<div class="row"><b>env right</b>: '  + envVal('env(safe-area-inset-right, 0px)') + '</div>';
}
update();
addEventListener('resize', update);
if (window.visualViewport) {
  visualViewport.addEventListener('resize', update);
  visualViewport.addEventListener('scroll', update);
}
</script>
</body>
</html>
