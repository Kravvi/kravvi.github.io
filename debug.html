<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>viewport debug 2</title>
<style>
  html, body { margin:0; padding:0; background:#111; color:#eee; }
  body { font: 13px monospace; padding: 12px; }
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 6px;
    background: #ff2d2d; z-index: 9999;
  }
  #marker {
    position: absolute; top: 40px; left: 12px;
    background: #00e676; color: #000; padding: 2px 6px;
    font-weight: bold;
  }
  div.row { padding:2px 0; }
  b { color:#A8895C; }
</style>
</head>
<body>
<div id="topbar"></div>
<div id="marker">TOP-MARKER</div>
<div style="height:60px"></div>
<div id="out">…</div>
<script>
function update() {
  var vv = window.visualViewport || {};
  var d = document.documentElement;
  document.getElementById('out').innerHTML =
    '<div class="row"><b>innerH</b>: '  + window.innerHeight + '</div>' +
    '<div class="row"><b>vv.height</b>: '   + vv.height   + '</div>' +
    '<div class="row"><b>vv.offsetTop</b>: '  + vv.offsetTop  + '</div>' +
    '<div class="row"><b>1vh</b>: ' + (window.innerHeight/100).toFixed(2) + 'px</div>' +
    '<div class="row"><b>UA</b>: ' + navigator.userAgent + '</div>';
}
update();
addEventListener('resize', update);
if (window.visualViewport) {
  visualViewport.addEventListener('resize', update);
  visualViewport.addEventListener('scroll', update);
}
</script>
</body>
</html>
